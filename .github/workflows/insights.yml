name: AI insights

on:
  schedule:
    - cron: '30 0 * * *'    # 07:30 WIB — morning edition
    - cron: '0 5 * * *'     # 12:00 WIB — midday
    - cron: '0 10 * * *'    # 17:00 WIB — evening
  workflow_dispatch: {}

concurrency:
  group: ai-insights
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate insights with Gemini
        run: node scripts/insights.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
