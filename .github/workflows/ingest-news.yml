name: Ingest news

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

concurrency:
  group: ingest-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull feeds into Supabase
        run: node scripts/ingest.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
